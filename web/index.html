<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">
  <meta name="description" content="文衡编辑台，出版社审稿与编辑工作流。">
  <title>文衡编辑台 · 出版社审稿工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主内容</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1" aria-busy="true">
        <div class="loading">正在加载编辑工作区…</div>
      </main>
      <footer class="main-footer" id="footer"></footer>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript 以使用编辑工作台。</noscript>
</body>
</html>
